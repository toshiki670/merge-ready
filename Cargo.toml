[package]
name = "merge-ready"
version = "1.0.4"
edition = "2024"
rust-version = "1.96"
description = "Show pull request merge blockers as concise prompt tokens"
license = "MIT"
repository = "https://github.com/toshiki670/merge-ready"
homepage = "https://github.com/toshiki670/merge-ready"
readme = "README.md"
keywords = ["pull-request", "cli", "prompt", "developer-tools", "merge"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"

[dependencies]
humantime = "2.3"
nu-ansi-term = "0.50"
clap = { version = "4.6", features = ["derive", "cargo"] }
clap_complete = "4.6"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
toml = "1.1"
crossterm = "0.29"
bitflags = "2.13"
# watch テーブルの列揃えを端末上の表示幅（Unicode Annex #11）基準で計算する。
# CJK・絵文字は 2 桁幅、結合文字は 0 桁幅のため、char 数では正しく揃わない。
unicode-width = "0.2"
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
# 設定ファイルの変更検知（非暗号学的な内容ハッシュ）に使う。独自実装を避け xxHash を利用。
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }

[target.'cfg(unix)'.dependencies]
# 全 unix で起動ユーザの uid を取得し、temp ディレクトリを名前空間分離する。
# `unsafe_code = "forbid"` のため libc の生 FFI ではなく safe な rustix を使う。
rustix = { version = "1.1", features = ["process"] }

[lib]
name = "merge_ready"
path = "src/lib.rs"

[[bin]]
name = "merge-ready"
path = "src/main.rs"

[[bin]]
name = "merge-ready-prompt"
path = "src_prompt/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[dev-dependencies]
assert_cmd = "2.2"
criterion = { version = "0.8", features = ["html_reports"] }
predicates = "3.1"
rstest = "0.26"
serde_json = "1.0"
tempfile = "3.27"
# watch テーブルの列揃えを E2E で検証する際、端末表示幅を独立して計測するために使う。
unicode-width = "0.2"
tokio = { version = "1.52", features = ["test-util"] }

[[bench]]
name = "hot_path"
harness = false

[profile.release]
strip = "symbols"
